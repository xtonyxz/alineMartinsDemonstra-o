<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aline Martins Corretora</title>
<style>
:root{--bg:#faf8f5;--card:#fff;--tx:#1d1b19;--mu:#6b655e;--ac:#b08d57;--ac2:#8a6b3a;--dk:#1d1b19;--bd:#e8e2d9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141311;--card:#1e1c19;--tx:#f3efe9;--mu:#a39b90;--bd:#33302b;--dk:#0c0b0a}}
:root[data-theme="dark"]{--bg:#141311;--card:#1e1c19;--tx:#f3efe9;--mu:#a39b90;--bd:#33302b;--dk:#0c0b0a}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--tx);font-family:Georgia,'Times New Roman',serif;line-height:1.55}
h1,h2,h3,.logo{font-family:Georgia,serif;font-weight:600}
p,a,button,input,select,textarea,label,small,span.s{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
a{color:inherit;text-decoration:none}
.w{max-width:1140px;margin:auto;padding:0 20px}
header{position:sticky;top:0;z-index:20;background:var(--bg);border-bottom:1px solid var(--bd)}
.nav{display:flex;align-items:center;justify-content:space-between;height:64px}
.logo{font-size:1.2rem}.logo b{color:var(--ac)}.logo small{display:block;font-size:.62rem;letter-spacing:.2em;color:var(--mu);font-weight:400;text-transform:uppercase;margin-top:-2px}
nav a{margin-left:22px;font-size:.92rem;color:var(--mu)}nav a.on,nav a:hover{color:var(--tx)}
#mb{display:none;background:none;border:1px solid var(--bd);color:var(--tx);border-radius:8px;padding:6px 12px;font-size:1.1rem}
.btn{display:inline-block;background:var(--ac);color:#fff;padding:12px 24px;border-radius:999px;border:0;font-size:.95rem;cursor:pointer;font-weight:600}
.btn:hover{background:var(--ac2)}.btn.o{background:none;border:1px solid var(--ac);color:var(--ac)}.btn.wa{background:#25a244}
.hero{position:relative;height:min(78vh,560px);overflow:hidden;background:var(--dk)}
.sl{position:absolute;inset:0;opacity:0;transition:opacity .8s}.sl.on{opacity:1}
.sl svg{width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.72),rgba(0,0,0,.15));display:flex;align-items:center}
.ov .t{max-width:560px;color:#fff}.ov small{letter-spacing:.2em;text-transform:uppercase;color:#e3c690;font-size:.75rem}
.ov h1{font-size:clamp(1.8rem,5vw,3.2rem);line-height:1.15;margin:8px 0 12px}.ov p{opacity:.9;margin-bottom:20px}
.dots{position:absolute;bottom:16px;left:0;right:0;text-align:center}
.dots i{display:inline-block;width:9px;height:9px;border-radius:50%;background:#fff6;margin:0 4px;cursor:pointer}.dots i.on{background:#fff}
section{padding:56px 0}h2{font-size:clamp(1.5rem,3.5vw,2.1rem);margin-bottom:6px}
.sub{color:var(--mu);margin-bottom:28px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:22px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;transition:transform .2s;display:block}
.card:hover{transform:translateY(-4px)}
.ph{aspect-ratio:4/3;overflow:hidden;position:relative}.ph svg{width:100%;height:100%;display:block}
.tag{position:absolute;top:10px;left:10px;background:var(--dk);color:#fff;font-size:.72rem;padding:4px 10px;border-radius:999px;font-family:system-ui}
.cb{padding:16px}.cb h3{font-size:1.05rem}.cb .l{color:var(--mu);font-size:.85rem;margin:2px 0 8px}
.pr{color:var(--ac2);font-size:1.25rem;font-weight:700;font-family:system-ui}
.ft{display:flex;gap:14px;font-size:.82rem;color:var(--mu);margin-top:8px;font-family:system-ui}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:24px}
.bar input,.bar select,.f input,.f textarea,.f select{padding:11px 14px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:.95rem;flex:1;min-width:150px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:36px;align-items:start}
.ab img{width:100%;border-radius:16px;display:block;max-height:560px;object-fit:cover;object-position:top}
.st{display:flex;gap:28px;margin:20px 0}.st b{font-size:1.7rem;color:var(--ac);display:block;font-family:Georgia}.st span{font-size:.82rem;color:var(--mu);font-family:system-ui}
.band{background:var(--dk);color:#fff;text-align:center}.band h2{color:#fff}.band p{opacity:.8;margin-bottom:20px}
.gal{display:grid;grid-template-columns:2fr 1fr;gap:10px}.gal .ph{border-radius:12px;aspect-ratio:auto;min-height:150px}
.gal .m{grid-row:span 2;min-height:340px}
.fa{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:20px 0}
.fa div{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:14px;text-align:center;font-family:system-ui}.fa b{display:block;font-size:1.4rem}.fa span{font-size:.78rem;color:var(--mu)}
.side{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;position:sticky;top:80px}
.f{display:grid;gap:12px}.f textarea{min-height:110px;resize:vertical}
.map{border:1px solid var(--bd);border-radius:14px;overflow:hidden}.map svg{display:block;width:100%}
footer{background:var(--dk);color:#bdb6ab;padding:36px 0;font-size:.88rem;font-family:system-ui}
.fw{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;width:58px;height:58px;border-radius:50%;background:#25a244;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px #0005}
.fw svg{width:32px;height:32px;fill:#fff}
.ok{background:#25a24422;border:1px solid #25a244;border-radius:10px;padding:14px;font-family:system-ui}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.two{grid-template-columns:1fr}.side{position:static}}
@media(max-width:620px){#mb{display:block}nav{display:none;position:absolute;top:64px;left:0;right:0;background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 20px}nav.o{display:block}nav a{display:block;margin:0;padding:12px 0}
.grid{grid-template-columns:1fr}.fa{grid-template-columns:repeat(2,1fr)}.gal{grid-template-columns:1fr}.gal .m{min-height:240px}section{padding:40px 0}}
</style></head><body>

else{const hh=tp=='Cobertura'?190:tp=='Comercial'?150:220;let w='';for(let y=0;y<Math.floor(hh/38);y++)for(let x=0;x<4;x++)w+=`<rect x="${215+x*46}" y="${250-hh+14+y*38}" width="30" height="22" fill="${(x+y+id)%3?'#bfe3f2':'#ffe9a8'}"/>`;
b=`<rect x="200" y="${250-hh}" width="200" height="${hh}" fill="hsl(${h},20%,88%)"/><rect x="200" y="${250-hh}" width="200" height="8" fill="hsl(${h},35%,35%)"/>${w}<rect x="285" y="215" width="30" height="35" fill="hsl(${h},30%,28%)"/><rect x="130" y="${250-hh*.6}" width="70" height="${hh*.6}" fill="hsl(${h},18%,80%)"/><rect x="400" y="${250-hh*.7}" width="70" height="${hh*.7}" fill="hsl(${h},18%,78%)"/>`}
return`<svg viewBox="0 0 600 300" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="g${id}${v}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="hsl(${200+v*15},70%,${72-v*4}%)"/><stop offset="1" stop-color="hsl(${30+v*10},80%,88%)"/></linearGradient></defs><rect width="600" height="300" fill="url(#g${id}${v})"/><circle cx="${sx}" cy="60" r="26" fill="#fff6c9" opacity=".9"/>${tp=='Terreno'?'':'<rect y="250" width="600" height="50" fill="hsl(110,25%,38%)"/>'}${b}</svg>`}
function card(p){return`<a class="card" href="#/imovel/${p[0]}"><div class="ph">${scene(p)}<span class="tag">${p[3]}</span></div><div class="cb"><h3>${p[1]}</h3><div class="l">📍 ${p[4]} · Brasília, DF</div><div class="pr">${brl(p[5])}${p[3]=='Aluguel'?'<small>/mês</small>':''}</div><div class="ft">${p[6]?`<span>🛏 ${p[6]}</span><span>🛁 ${p[7]}</span>`:''}${p[8]?`<span>🚗 ${p[8]}</span>`:''}<span>📐 ${p[9]} m²</span></div></div></a>`}
let tm;
function home(){const f=P.filter(p=>p[10]);const sl=[f[0],f[1],f[2]];
const txt=['Seu novo lar em Brasília começa aqui','Casas com conforto e espaço para a família','Coberturas e vistas que fazem a diferença'];
return`<div class="hero">${sl.map((p,i)=>`<div class="sl ${i?'':'on'}">${scene(p,i)}<div class="ov"><div class="w"><div class="t"><small>Aline Martins Corretora</small><h1>${txt[i]}</h1><p>${p[1]} · ${p[4]} · a partir de ${brl(p[5])}</p><a class="btn" href="#/imovel/${p[0]}">Ver imóvel</a> <a class="btn o" style="color:#fff;border-color:#fff" href="#/imoveis">Todos os imóveis</a></div></div></div></div>`).join('')}<div class="dots">${sl.map((_,i)=>`<i class="${i?'':'on'}" data-i="${i}"></i>`).join('')}</div></div>
<section><div class="w"><h2>Imóveis em destaque</h2><p class="sub">Uma seleção especial para você.</p><div class="grid">${f.slice(0,6).map(card).join('')}</div><p style="text-align:center;margin-top:28px"><a class="btn o" href="#/imoveis">Ver todos os imóveis</a></p></div></section>
<section style="background:var(--card)"><div class="w two ab"><img src="${FOTO}" alt="Aline Martins"><div><h2>Olá, eu sou a Aline</h2><p class="sub">Atendimento próximo, claro e sem pressa.</p><p>Ajudo famílias e investidores a encontrar o imóvel certo, com transparência em cada etapa: da primeira visita à entrega das chaves.</p><div class="st"><div><b>10+</b><span>anos de experiência</span></div><div><b>300+</b><span>famílias atendidas</span></div></div><a class="btn" href="#/sobre">Conheça minha história</a></div></div></section>
<section class="band"><div class="w"><h2>Quer vender ou alugar seu imóvel?</h2><p>Faço uma avaliação gratuita e cuido de todo o processo.</p><a class="btn wa" target="_blank" href="${wa('Olá, Aline! Quero avaliar meu imóvel.')}">Falar no WhatsApp</a></div></section>`}
function startCar(){const s=[...document.querySelectorAll('.sl')],d=[...document.querySelectorAll('.dots i')];if(!s.length)return;let i=0;const go=n=>{i=n;s.forEach((e,k)=>e.classList.toggle('on',k==n));d.forEach((e,k)=>e.classList.toggle('on',k==n))};d.forEach(e=>e.onclick=()=>go(+e.dataset.i));tm=setInterval(()=>go((i+1)%s.length),5000)}
function list(){return`<section><div class="w"><h2>Imóveis</h2><p class="sub">Encontre o imóvel ideal para você.</p><div class="bar"><input id="q" placeholder="Buscar por bairro ou nome"><select id="ft"><option value="">Venda ou aluguel</option><option>Venda</option><option>Aluguel</option></select><select id="tp"><option value="">Todos os tipos</option><option>Apartamento</option><option>Casa</option><option>Cobertura</option><option>Comercial</option><option>Terreno</option></select></div><div class="grid" id="ls"></div></div></section>`}
function filt(){const q=document.getElementById('q').value.toLowerCase(),f=ft.value,t=tp.value;const r=P.filter(p=>(!q||(p[1]+p[4]).toLowerCase().includes(q))&&(!f||p[3]==f)&&(!t||p[2]==t));ls.innerHTML=r.length?r.map(card).join(''):'<p>Nenhum imóvel encontrado.</p>'}
function det(id){const p=get(id);if(!p)return'<div class="w"><p>Imóvel não encontrado.</p></div>';
const m=wa(`Olá, Aline! Tenho interesse no imóvel "${p[1]}" (${p[4]}, ${brl(p[5])}). Podemos conversar?`);
const fa=[p[6]?['🛏',p[6],'Quartos']:0,p[6]?['🛁',p[7],'Banheiros']:0,p[8]?['🚗',p[8],'Vagas']:0,['📐',p[9]+' m²','Área']].filter(Boolean);
return`<section><div class="w"><p style="margin-bottom:14px"><a href="#/imoveis" style="color:var(--ac2)">← Voltar aos imóveis</a></p><div class="gal"><div class="ph m">${scene(p,0)}</div><div class="ph">${scene(p,1)}</div><div class="ph">${scene(p,2)}</div></div>
<div class="two" style="grid-template-columns:2fr 1fr;margin-top:26px"><div><small style="color:var(--ac2)">${p[2]} · ${p[3]}</small><h2>${p[1]}</h2><p class="sub">📍 ${p[4]} · Brasília, DF</p><div class="fa">${fa.map(x=>`<div>${x[0]}<b>${x[1]}</b><span>${x[2]}</span></div>`).join('')}</div>
<h3>Descrição</h3><p style="margin:8px 0 18px">${p[2]} bem localizado em ${p[4]}, com ${p[9]} m² de área${p[6]?`, ${p[6]} quarto(s) e ${p[7]} banheiro(s)`:''}. Ambientes iluminados, ótima ventilação e acabamento de qualidade. Próximo a comércio, escolas e transporte. Agende uma visita e conheça de perto.</p>
<h3>Informações principais</h3><ul style="margin:8px 0 0 20px;font-family:system-ui;color:var(--mu)"><li>Código do imóvel: AM-${String(p[0]).padStart(3,'0')}</li><li>Finalidade: ${p[3]}</li><li>Tipo: ${p[2]}</li><li>Documentação em dia</li><li>Aceita financiamento</li></ul></div>
<aside class="side"><div class="pr" style="font-size:1.7rem">${brl(p[5])}${p[3]=='Aluguel'?'<small>/mês</small>':''}</div><p style="color:var(--mu);margin:6px 0 16px;font-size:.9rem">Fale agora com a Aline e agende sua visita.</p><a class="btn wa" style="display:block;text-align:center" target="_blank" href="${m}">Atendimento via WhatsApp</a><p style="margin-top:12px;font-size:.78rem;color:var(--mu)">As fotos são ilustrativas e serão trocadas pelas fotos reais.</p></aside></div></div></section>`}
function about(){return`<section><div class="w two ab"><img src="${FOTO}" alt="Aline Martins"><div><h2>Sobre a corretora</h2><p class="sub">Aline Martins · CRECI 00000-F (exemplo)</p><p style="margin-bottom:12px">Atuo no mercado imobiliário de Brasília com um propósito simples: tornar a compra, a venda e o aluguel de imóveis uma experiência segura e tranquila.</p><p style="margin-bottom:12px">Meu atendimento é personalizado. Escuto o que você precisa, apresento boas opções e acompanho cada etapa, da negociação à documentação.</p><div class="st"><div><b>10+</b><span>anos de mercado</span></div><div><b>300+</b><span>clientes atendidos</span></div><div><b>100%</b><span>transparência</span></div></div><ul style="margin:0 0 20px 20px;font-family:system-ui;color:var(--mu)"><li>Compra e venda de imóveis</li><li>Locação residencial e comercial</li><li>Avaliação gratuita de imóveis</li><li>Auxílio com financiamento</li></ul><a class="btn wa" target="_blank" href="${wa('Olá, Aline! Gostaria de conversar.')}">Chamar no WhatsApp</a></div></div></section>`}
function contact(){return`<section><div class="w"><h2>Contato</h2><p class="sub">Envie sua mensagem ou chame direto no WhatsApp.</p><div class="two"><div><form class="f" id="cf"><input name="n" placeholder="Seu nome" required><input name="t" placeholder="Telefone / WhatsApp" required><input name="e" type="email" placeholder="E-mail"><select name="i"><option>Quero comprar</option><option>Quero alugar</option><option>Quero vender / anunciar</option></select><textarea name="m" placeholder="Como posso ajudar?"></textarea><button class="btn" type="submit">Enviar mensagem</button></form><div id="rs"></div><p style="margin:18px 0;font-family:system-ui;color:var(--mu);font-size:.92rem">📞 (61) 99999-9999<br>✉️ contato@alinemartins.com.br<br>📍 Brasília – DF</p><a class="btn wa" target="_blank" href="${wa('Olá, Aline! Vim pelo site.')}">Falar no WhatsApp</a></div>
<div class="map"><svg viewBox="0 0 400 320"><rect width="400" height="320" fill="#e9e4da"/><path d="M0 200 Q120 150 200 170 T400 120" stroke="#fff" stroke-width="16" fill="none"/><path d="M80 0 L140 320" stroke="#fff" stroke-width="10"/><path d="M0 70 L400 90" stroke="#fff" stroke-width="8"/><path d="M280 0 L240 320" stroke="#fff" stroke-width="7"/><rect x="300" y="200" width="80" height="80" rx="10" fill="#cfe3c4"/><path d="M200 120c-17 0-30 13-30 30 0 22 30 55 30 55s30-33 30-55c0-17-13-30-30-30z" fill="#b08d57"/><circle cx="200" cy="150" r="10" fill="#fff"/></svg><div style="padding:12px 16px;background:var(--card);font-family:system-ui;font-size:.9rem;display:flex;justify-content:space-between;gap:10px;align-items:center"><span>Escritório · Brasília, DF</span><a style="color:var(--ac2);font-weight:600" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=Bras%C3%ADlia+DF">Abrir no Maps ↗</a></div></div></div></div></section>`}
function route(){clearInterval(tm);const h=location.hash.replace('#/','').split('/'),a=document.getElementById('app');
const r=h[0]||'';a.innerHTML=r=='imoveis'?list():r=='imovel'?det(h[1]):r=='sobre'?about():r=='contato'?contact():home();
document.querySelectorAll('nav a').forEach(x=>x.classList.toggle('on',x.getAttribute('href')=='#/'+(r=='imovel'?'imoveis':r)));
nv.classList.remove('o');window.scrollTo(0,0);
if(r==''){startCar()}
if(r=='imoveis'){['q','ft','tp'].forEach(i=>document.getElementById(i).oninput=filt);filt()}
if(r=='contato')cf.onsubmit=e=>{e.preventDefault();const d=new FormData(cf);window.open(wa(`Olá, Aline! Sou ${d.get('n')} (${d.get('t')}). ${d.get('i')}. ${d.get('m')}`),'_blank');rs.innerHTML='<div class="ok" style="margin-top:12px">Mensagem recebida! Em breve a Aline entrará em contato.</div>';cf.reset()}}
mb.onclick=()=>nv.classList.toggle('o');
addEventListener('hashchange',route);route();
</script></body></html>
